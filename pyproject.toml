[build-system]
requires = ["setuptools>=75.0,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-model"
version = "0.1.0"
description = "Executable architectural model for the Bifröst NoC Router"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["model"]
include = ["bifrost_model*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["model/tests"]
