spec_revision: "0.2"
source: BIFROST_SPEC.md
profiles:
  core_v0_2:
    label: Core
    stage: current
    qos_enabled: false
  qos_extension_v0_2:
    label: QoS
    stage: staged
    qos_enabled: true

requirements:
  - id: FUNC-001
    profile: core_v0_2
    stage: planned
    description: Forward legal packet flits without modification.
    verification_methods: [simulation, formal]
  - id: FUNC-002
    profile: core_v0_2
    stage: planned
    description: Implement five physical ports in a 2D mesh router.
    verification_methods: [static_analysis, simulation]
  - id: FUNC-003
    profile: core_v0_2
    stage: partial
    description: Support wormhole packet switching and bubbles without packet interleaving in one VC.
    verification_methods: [unit_test, simulation, formal]
  - id: ROUTE-001
    profile: core_v0_2
    stage: implemented
    description: Route all legal destinations using deterministic XY routing.
    verification_methods: [unit_test, formal]
  - id: ROUTE-002
    profile: core_v0_2
    stage: implemented
    description: Deliver packets locally only at matching coordinates.
    verification_methods: [unit_test, formal]
  - id: VC-001
    profile: core_v0_2
    stage: planned
    description: Maintain independent FIFO and packet state per input VC.
    verification_methods: [unit_test, simulation, formal]
  - id: VC-002
    profile: core_v0_2
    stage: planned
    description: Allocate each output VC to at most one local packet.
    verification_methods: [unit_test, simulation, formal]
  - id: VC-003
    profile: core_v0_2
    stage: planned
    description: Hold output-VC ownership until the packet tail transmits.
    verification_methods: [unit_test, simulation, formal]
  - id: VC-004
    profile: core_v0_2
    stage: planned
    description: Release head+tail and multi-flit packet reservations exactly once.
    verification_methods: [unit_test, simulation, formal]
  - id: FLOW-001
    profile: core_v0_2
    stage: implemented
    description: Transmit only with positive registered downstream credit.
    verification_methods: [unit_test, formal]
  - id: FLOW-002
    profile: core_v0_2
    stage: implemented
    description: Maintain credit counts within legal bounds.
    verification_methods: [unit_test, formal]
  - id: FLOW-003
    profile: core_v0_2
    stage: planned
    description: Return exactly one credit for each released input entry.
    verification_methods: [simulation, formal]
  - id: FLOW-004
    profile: core_v0_2
    stage: implemented
    description: Implement the specified simultaneous send/credit-return truth table.
    verification_methods: [unit_test, formal]
  - id: ARB-001
    profile: core_v0_2
    stage: planned
    description: Grant at most one input to each physical output per cycle.
    verification_methods: [unit_test, simulation, formal]
  - id: ARB-002
    profile: core_v0_2
    stage: planned
    description: Serve each continuously eligible requester within the stated round-robin bound.
    verification_methods: [unit_test, simulation, formal]
  - id: QOS-001
    profile: qos_extension_v0_2
    stage: staged
    description: Support weighted service among four traffic classes.
    verification_methods: [simulation, formal, performance_report]
  - id: QOS-002
    profile: qos_extension_v0_2
    stage: staged
    description: Enforce the configured bounded-aging threshold under stated assumptions.
    verification_methods: [simulation, formal, performance_report]
  - id: PERF-001
    profile: core_v0_2
    stage: planned
    description: Sustain one flit per physical output per cycle.
    verification_methods: [simulation, performance_report]
  - id: PERF-002
    profile: core_v0_2
    stage: planned
    description: Support concurrent transfers on nonconflicting outputs.
    verification_methods: [simulation, formal]
  - id: PERF-003
    profile: core_v0_2
    stage: planned
    description: Meet four-cycle maximum unloaded router latency.
    verification_methods: [simulation, performance_report]
  - id: DEAD-001
    profile: core_v0_2
    stage: planned
    description: Preserve an acyclic XY channel-dependency order.
    verification_methods: [formal, design_review]
  - id: TIM-001
    profile: core_v0_2
    stage: planned
    description: Meet the 2.0 ns reference clock after implementation.
    verification_methods: [timing_report]
  - id: PWR-001
    profile: core_v0_2
    stage: planned
    description: Keep idle and disabled structures quiescent.
    verification_methods: [simulation, power_report]
  - id: RST-001
    profile: core_v0_2
    stage: planned
    description: Flush all buffered and reserved traffic state on coordinated reset.
    verification_methods: [simulation, formal]
  - id: VER-001
    profile: core_v0_2
    stage: planned
    description: Demonstrate no loss, duplication, corruption, or illegal reordering.
    verification_methods: [simulation, formal]
  - id: VER-002
    profile: core_v0_2
    stage: implemented
    description: Keep the verification oracle independent from candidate RTL changes.
    verification_methods: [static_analysis, process_review]
